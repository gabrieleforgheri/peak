<!doctype html>
<!-- Clip «sincronizzazione» della pagina yrb4g.com/studio/peak: una serie segnata sul Watch arriva all'iPhone e al web.
     Tre superfici astratte (nessuna cornice disegnata), solo numeri: vale per tutte e due le lingue. -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=780, height=1688" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 780px; height: 1688px; overflow: hidden; background: #0b0d14; }
      :root {
        --card: rgba(255, 255, 255, 0.055); --stroke: rgba(255, 255, 255, 0.1); --stroke-strong: rgba(255, 255, 255, 0.18);
        --text: rgba(255, 255, 255, 0.95); --text-3: rgba(255, 255, 255, 0.35); --lime: rgb(184, 240, 77); --legs: rgb(140, 217, 107);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0d14; font-family: "Nunito", sans-serif; color: var(--text); }
      #bg {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(ellipse 760px 760px at 14% 4%, rgba(184, 240, 77, 0.2), transparent 62%),
          radial-gradient(ellipse 700px 700px at 98% 10%, rgba(74, 91, 255, 0.16), transparent 62%);
      }
      #scene { position: absolute; inset: 0; }
      .surf {
        position: absolute; background: var(--card); border: 2px solid var(--stroke); border-top-color: var(--stroke-strong);
        box-shadow: 0 20px 36px rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center;
      }
      .surf .hl { position: absolute; inset: -2px; border-radius: inherit; box-shadow: 0 0 0 3px rgba(184, 240, 77, 0.6), 0 0 110px rgba(184, 240, 77, 0.25); opacity: 0; }
      #web { left: 60px; top: 250px; width: 660px; height: 400px; border-radius: 40px; gap: 40px; }
      #phone { left: 60px; top: 760px; width: 310px; height: 640px; border-radius: 56px; flex-direction: column; gap: 34px; }
      #watch { left: 440px; top: 930px; width: 280px; height: 330px; border-radius: 84px; }
      .tile { width: 120px; height: 120px; border-radius: 32px; display: grid; place-items: center; background: rgba(140, 217, 107, 0.16); color: var(--legs); }
      .tile svg { width: 80px; height: 80px; }
      .num { font-weight: 900; font-size: 92px; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
      .num i { font-style: normal; font-weight: 800; font-size: 38px; color: var(--text-3); margin-left: 8px; }
      #watch .num { font-size: 104px; color: var(--lime); }
      #wires { position: absolute; inset: 0; width: 780px; height: 1688px; }
      #wires path { fill: none; stroke: rgba(184, 240, 77, 0.28); stroke-width: 3; stroke-dasharray: 2 14; stroke-linecap: round; }
      .dot { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 30px rgba(184, 240, 77, 0.8); opacity: 0; }
      #tap { position: absolute; left: 580px; top: 1095px; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 4px solid var(--lime); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="sync" data-start="0" data-duration="6.5" data-width="780" data-height="1688">
      <div id="bg"></div>
      <section id="scene" class="clip" data-start="0" data-duration="6.5">
        <svg id="wires" viewBox="0 0 780 1688" aria-hidden="true">
          <path d="M580 930 C 560 860, 300 860, 215 760" />
          <path d="M215 760 C 215 720, 390 700, 390 650" />
        </svg>
        <div class="surf" id="web">
          <div class="hl"></div>
          <div class="tile"><svg viewBox="0 0 1 1" aria-hidden="true"><line x1="0.2" y1="0.78" x2="0.72" y2="0.34" stroke="currentColor" stroke-width="0.1" stroke-linecap="round"/><line x1="0.64" y1="0.2" x2="0.86" y2="0.44" stroke="currentColor" stroke-width="0.1" stroke-linecap="round"/><rect x="0.1" y="0.62" width="0.22" height="0.08" rx="0.028" fill="currentColor"/><circle cx="0.48" cy="0.58" r="0.09" fill="none" stroke="currentColor" stroke-width="0.055"/><line x1="0.08" y1="0.88" x2="0.92" y2="0.88" stroke="currentColor" stroke-width="0.055" stroke-linecap="round"/></svg></div>
          <div class="num"><span class="v" id="vWeb">170</span><i>kg</i></div>
        </div>
        <div class="surf" id="phone">
          <div class="hl"></div>
          <div class="tile"><svg viewBox="0 0 1 1" aria-hidden="true"><line x1="0.2" y1="0.78" x2="0.72" y2="0.34" stroke="currentColor" stroke-width="0.1" stroke-linecap="round"/><line x1="0.64" y1="0.2" x2="0.86" y2="0.44" stroke="currentColor" stroke-width="0.1" stroke-linecap="round"/><rect x="0.1" y="0.62" width="0.22" height="0.08" rx="0.028" fill="currentColor"/><circle cx="0.48" cy="0.58" r="0.09" fill="none" stroke="currentColor" stroke-width="0.055"/><line x1="0.08" y1="0.88" x2="0.92" y2="0.88" stroke="currentColor" stroke-width="0.055" stroke-linecap="round"/></svg></div>
          <div class="num"><span class="v" id="vPhone">170</span><i>kg</i></div>
        </div>
        <div class="surf" id="watch">
          <div class="hl"></div>
          <div class="num"><span class="v" id="vWatch">170</span></div>
        </div>
        <div id="tap"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, at);
      // Un numero che passa a 175 nell'istante `at`, rimesso a 170 tornando indietro.
      const bump = (id, at) => {
        const el = document.getElementById(id);
        const o = { v: 170 };
        tl.fromTo(o, { v: 170 }, {
          v: 175, duration: 0.01, ease: "none",
          onUpdate: () => { el.textContent = String(Math.round(o.v)); },
          onReverseComplete: () => { el.textContent = "170"; },
        }, at);
        tl.fromTo(`#${el.closest(".surf").id} .hl`, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, at);
        tl.fromTo(`#${id}`, { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, at);
      };
      // Un punto lungo una curva: campioni della path, così il moto è seekabile senza plugin.
      const travel = (dot, pathIndex, at, d) => {
        const p = document.querySelectorAll("#wires path")[pathIndex];
        const len = p.getTotalLength();
        const o = { t: 0 };
        const el = document.getElementById(dot);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12 }, at);
        tl.fromTo(o, { t: 0 }, {
          t: 1, duration: d, ease: "power1.inOut",
          onUpdate: () => { const pt = p.getPointAtLength(o.t * len); gsap.set(el, { x: pt.x, y: pt.y }); },
        }, at);
        tl.to(el, { opacity: 0, duration: 0.12 }, at + d - 0.06);
      };
      gsap.set(".v", { display: "inline-block" });
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "none" }, 0);
      rise("#web", 0.15);
      rise("#phone", 0.35);
      rise("#watch", 0.55);
      tl.fromTo("#wires", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);
      // Il tocco sul Watch.
      tl.fromTo("#tap", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.4, duration: 0.7, ease: "power2.out" }, 1.4);
      bump("vWatch", 1.5);
      travel("d1", 0, 1.8, 0.7);
      bump("vPhone", 2.5);
      travel("d2", 1, 2.75, 0.55);
      bump("vWeb", 3.3);
      // Ritorno al fondo vuoto per il loop.
      tl.to("#scene", { opacity: 0, duration: 0.6, ease: "power1.in" }, 5.6);
      tl.to("#bg", { opacity: 0, duration: 0.6, ease: "power1.in" }, 5.7);
      window.__timelines["sync"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
